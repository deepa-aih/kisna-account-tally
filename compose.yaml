services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./backend/work/.env
    environment:
      FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3206}
      FRONTEND_ORIGINS: ${APP_FRONTEND_ORIGINS:-http://localhost:3206}
    ports:
      - "3206:9104"
      - "9104:9104"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9104/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
